spring.application.name=sistema-pedidos-springboot

# ==============================
# SERVIDOR
# ==============================
server.port=8081
server.servlet.context-path=/sistema-pedidos

# ==============================
# SPRING MVC / JSP
# ==============================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===================================================================
# MYSQL - Base de datos principal (Por defecto)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidosdb?serverTimezone=America/Lima&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:spedidos_app}
spring.datasource.password=${DB_PASSWORD:userapp_2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACION DE JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================
# INVENTARIO SERVICE
# ==============================
inventario.api.base-url=http://localhost:8082/inventario-service/api/inventario
inventario.api.connect-timeout-ms=2000
inventario.api.read-timeout-ms=3000

# ==============================
# SEGURIDAD
# ==============================
demo.security.operador-password=${PEDIDOS_OPERADOR_PASSWORD:OperadorDemo2026!}
demo.security.consulta-password=${PEDIDOS_CONSULTA_PASSWORD:ConsultaDemo2026!}

# Logging de Spring JDBC para auditoría de consultas analíticas
logging.level.org.springframework.jdbc.core=DEBUG

